startCommand:
  type: http
  configSchema:
    type: object
    properties:
      pdf_page_format:
        type: string
        title: PDF Page Format
        description: Paper size for PDF output. Controls page dimensions for Markdown-to-PDF conversion.
        default: A4
        enum:
          - A4
          - Letter
          - Legal
          - Tabloid
      pdf_margin:
        type: string
        title: PDF Margin
        description: "PDF margin in CSS units, applied to all sides. Examples: '20mm', '1in', '0.5cm'."
        default: "20mm"
      html_theme:
        type: string
        title: HTML Theme
        description: "Visual theme for HTML/PDF/PNG output. 'light' = white background, 'dark' = dark background."
        default: light
        enum:
          - light
          - dark
      default_title:
        type: string
        title: Default Document Title
        description: Fallback document title when none is provided. Used in PDF metadata, HTML title, XML root.
        default: document
      code_style:
        type: string
        title: Code Block Style
        description: Syntax highlighting theme for fenced code blocks in HTML, PDF, and image output.
        default: github
        enum:
          - github
          - monokai
          - dracula
          - solarized
      max_input_bytes:
        type: number
        title: Max Input Size (bytes)
        description: "Max input size in bytes. Documents exceeding this are rejected. Default: 1 GB (1073741824)."
        default: 1073741824
    required: []
  deploymentUrl: https://ai-answer-copier.vercel.app/api/mcp
