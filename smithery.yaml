startCommand:
  type: http
  configSchema:
    type: object
    properties:
      PUPPETEER_EXECUTABLE_PATH:
        type: string
        title: Chrome/Chromium Executable Path
        description: >-
          Optional absolute path to a Chrome, Edge, or Chromium executable
          for PDF and PNG rendering. If not set, the server auto-detects the
          browser from common installation locations.
    required: []
  deploymentUrl: https://ai-answer-copier.vercel.app/api/mcp
