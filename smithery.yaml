startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      PUPPETEER_EXECUTABLE_PATH:
        type: string
        title: Chrome/Chromium Executable Path
        description: >-
          Optional absolute path to a Chrome, Edge, or Chromium executable
          for PDF and PNG rendering. If not set, the server auto-detects the
          browser from common installation locations on Windows, macOS, and Linux.
    required: []
  commandFunction: |
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        ...process.env,
        ...(config.PUPPETEER_EXECUTABLE_PATH
          ? { PUPPETEER_EXECUTABLE_PATH: config.PUPPETEER_EXECUTABLE_PATH }
          : {})
      }
    })
